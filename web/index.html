<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Two Idiots, One Ship</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Two Idiots, One Ship</h1>
    <canvas id="arena" hidden></canvas>

    <section id="home">
      <p class="tagline">Two idiots, one ship. One pilots, one shoots, both survive the asteroid field together.</p>
      <button id="create">Create a room</button>
      <p class="hint">Or open a shared room link to join your copilot.</p>
    </section>

    <section id="room" hidden>
      <p>You are the <strong id="role"></strong>.</p>
      <p id="state"></p>
      <p id="partner"></p>
      <div id="share" class="share">
        <p class="hint">Send this link to your copilot:</p>
        <input id="share-link" readonly>
        <button id="copy">Copy</button>
      </div>
    </section>

    <section id="error" hidden>
      <p id="error-message"></p>
      <button id="home-again">Back</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
