<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Two Idiots, One Ship</title>
  <!-- The tab icon is a rocket emoji drawn into a tiny SVG, which is all a
       data URI has to be: no image file to serve or cache. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- The display face is the first thing the landing screen draws, so it
       is fetched alongside the stylesheet rather than behind it. -->
  <link rel="preload" href="michroma-latin-400.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <main>
    <h1><span id="rocket" aria-hidden="true">🚀</span>Two Idiots<br>One Ship</h1>
    <div id="stage">
      <canvas id="arena" hidden></canvas>
    </div>
    <div id="hud" hidden>
      <div class="hud-item"><span class="hud-label">Score</span><span id="hud-score">0</span></div>
      <div class="hud-item"><span class="hud-label">Time</span><span id="hud-time">0.0</span></div>
      <div class="hud-item"><span class="hud-label">Lives</span><span id="hud-lives">3</span></div>
      <div class="hud-item"><span class="hud-label">Role</span><span id="hud-role">—</span></div>
    </div>

    <section id="controls" hidden>
      <div id="stick" hidden></div>
      <div id="aim" hidden></div>
      <div id="pad-base" hidden></div>
      <div id="pad-knob" hidden></div>
    </section>

    <section id="round" hidden>
      <p id="round-title"></p>
      <p id="round-stats" hidden></p>
      <button id="play-again" hidden>Play again</button>
    </section>

    <section id="lobby" hidden>
      <div id="share" class="share">
        <p class="hint">Share your link with a friend:</p>
        <input id="share-link" readonly>
        <div class="actions">
          <button id="share-button" hidden>Share link</button>
          <button id="copy">Copy link</button>
        </div>
      </div>
      <p id="waiting" class="hint">Waiting for friend<span id="waiting-dots" aria-hidden="true">.</span></p>
    </section>

    <section id="error" hidden>
      <p id="error-message"></p>
      <button id="retry">Reload</button>
    </section>
  </main>
  <script src="interp.js"></script>
  <script src="renderer.js"></script>
  <script src="controls.js"></script>
  <script src="app.js"></script>
</body>
</html>
