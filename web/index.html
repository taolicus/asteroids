<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Two Idiots, One Ship</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Two Idiots, One Ship</h1>
    <canvas id="arena" hidden></canvas>

    <section id="lobby" hidden>
      <p id="seat"></p>
      <p id="state"></p>
      <div id="share" class="share" hidden>
        <p class="hint">Send this link to your copilot:</p>
        <input id="share-link" readonly>
        <div class="actions">
          <button id="share-button" hidden>Share link</button>
          <button id="copy">Copy link</button>
        </div>
      </div>
    </section>

    <section id="error" hidden>
      <p id="error-message"></p>
      <button id="retry">Reload</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
