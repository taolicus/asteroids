<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Two Idiots, One Ship</title>
  <!-- The tab icon is a rocket emoji drawn into a tiny SVG, which is all a
       data URI has to be: no image file to serve or cache. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- The display face is the first thing the landing screen draws, so it
       is fetched alongside the stylesheet rather than behind it. -->
  <link rel="preload" href="michroma-latin-400.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <main>
    <h1><span id="rocket" aria-hidden="true">🚀</span>Two Idiots<br>One Ship</h1>
    <div id="stage">
      <canvas id="arena" hidden></canvas>
      <!-- Over the arena, so a mid-round disconnect is told without
           taking a pixel of layout from the round. -->
      <div id="friend-note" hidden>Friend disconnected</div>
    </div>
    <div id="hud" hidden>
      <div class="hud-item"><span class="hud-label">Score</span><span id="hud-score">0</span></div>
      <div class="hud-item"><span class="hud-label">Time</span><span id="hud-time">0.0</span></div>
      <div class="hud-item"><span class="hud-label">Lives</span><span id="hud-lives">3</span></div>
      <div class="hud-item"><span class="hud-label">Role</span><span id="hud-role">—</span></div>
    </div>

    <section id="controls" hidden>
      <!-- The resting stand-in: first child so it paints behind the live
           pad, and pointer-events:none so it can never take a touch. -->
      <div id="rest" hidden>
        <div id="rest-pad"><div id="rest-knob"></div></div>
        <p id="rest-label" class="hint"></p>
      </div>
      <div id="stick" hidden></div>
      <div id="aim" hidden></div>
      <div id="pad-base" hidden></div>
      <div id="pad-knob" hidden></div>
    </section>

    <section id="round" hidden>
      <p id="round-title"></p>
      <p id="round-stats" hidden></p>
      <!-- Shown instead of Play again while the friend is gone: a
           restart needs both players, so the button would only 409. -->
      <p id="friend-wait" hidden>Waiting for your friend to come back…</p>
      <button id="play-again" hidden>Play again</button>
      <!-- Waiting has no end without the friend, so the panel also offers
           the one thing left to do. -->
      <button id="round-leave" hidden>Go to my room</button>
    </section>

    <section id="lobby" hidden>
      <div id="share" class="share">
        <p class="hint">Share your link with a friend:</p>
        <input id="share-link" readonly>
        <div class="actions">
          <button id="share-button" hidden>Share</button>
          <button id="copy">Copy</button>
        </div>
      </div>
      <p id="waiting" class="hint">Waiting for friend</p>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
    </section>

    <!-- A visitor who opened someone else's link and found the room's owner
         away. The room is not theirs, so there is no share box: what is
         actually happening, and the way back to their own room. -->
    <section id="guest" hidden>
      <p class="tagline">You're in someone else's room, and they aren't here right now.</p>
      <p id="guest-waiting" class="hint">Waiting for your friend to come back…</p>
      <div id="guest-spinner" class="spinner" aria-hidden="true"></div>
      <button id="guest-leave">Go to my room</button>
    </section>

    <section id="error" hidden>
      <p id="error-message"></p>
      <button id="retry">Reload</button>
      <!-- Reloading keeps the bad link in the URL and lands on the same
           error again; this is the way back to the player's own room. -->
      <button id="home">Go to my room</button>
    </section>
  </main>
  <script src="interp.js"></script>
  <script src="renderer.js"></script>
  <script src="controls.js"></script>
  <script src="app.js"></script>
</body>
</html>
